<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Program</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS to ensure Inter font is used */
        body {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

    <!-- Main container for the app -->
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm flex flex-col items-center space-y-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Hello There!</h1>

        <!-- Input section -->
        <div class="w-full">
            <label for="nameInput" class="block text-gray-700 text-sm font-semibold mb-2">
                What's your name?
            </label>
            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <!-- Button to show greeting -->
        <button
            id="greetButton"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 ease-in-out transform hover:scale-105"
        >
            Say Hello!
        </button>

        <!-- Custom message box for greeting -->
        <div
            id="messageBox"
            class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative w-full text-center mt-4"
            role="alert"
        >
            <span id="messageContent"></span>
            <button
                id="closeMessage"
                class="absolute top-0 right-0 mt-1 mr-2 text-green-700 hover:text-green-900 focus:outline-none"
                aria-label="Close"
            >
                &times;
            </button>
        </div>
    </div>

    <script>
        // Get references to HTML elements
        const nameInput = document.getElementById('nameInput');
        const greetButton = document.getElementById('greetButton');
        const messageBox = document.getElementById('messageBox');
        const messageContent = document.getElementById('messageContent');
        const closeMessageButton = document.getElementById('closeMessage');

        /**
         * Displays a greeting message in the custom message box.
         * @param {string} name - The name to include in the greeting.
         */
        function showGreeting(name) {
            // Check if the name is not empty
            if (name.trim() !== '') {
                messageContent.textContent = `Hello, ${name}! Welcome to the interactive greeting app.`;
                messageBox.classList.remove('hidden'); // Show the message box
                // Automatically hide the message after 5 seconds
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 5000);
            } else {
                // If the name is empty, display a prompt to enter a name
                messageContent.textContent = "Please enter your name!";
                messageBox.classList.remove('hidden');
                messageBox.classList.remove('bg-green-100', 'border-green-400', 'text-green-700');
                messageBox.classList.add('bg-red-100', 'border-red-400', 'text-red-700'); // Use red for error
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                    // Revert to green after hiding
                    messageBox.classList.remove('bg-red-100', 'border-red-400', 'text-red-700');
                    messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
                }, 3000);
            }
        }

        // Add event listener to the button
        greetButton.addEventListener('click', () => {
            const userName = nameInput.value; // Get the value from the input field
            showGreeting(userName); // Call the function to display the greeting
        });

        // Add event listener to the close button of the message box
        closeMessageButton.addEventListener('click', () => {
            messageBox.classList.add('hidden'); // Hide the message box when close button is clicked
        });

        // Optional: Allow pressing Enter key to trigger the greeting
        nameInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                greetButton.click(); // Simulate a click on the greet button
            }
        });
    </script>
</body>
</html>
