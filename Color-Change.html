<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
            transition: background-color 0.5s ease; /* Smooth transition for background color change */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="p-8 bg-white rounded-xl shadow-lg text-center">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Change Page Background</h1>
        <button
            id="changeColorBtn"
            onclick="changeBackgroundColor()"
            class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition duration-300 ease-in-out"
        >
            Change Color
        </button>
    </div>

    <script>
        // Array of colors to cycle through
        const colors = ['#f87171', '#60a5fa', '#34d399', '#facc15', '#a78bfa', '#fb7185', '#6ee7b7'];
        let currentColorIndex = 0;

        /**
         * @function changeBackgroundColor
         * @description Changes the background color of the document body to the next color in the `colors` array.
         * It cycles through the array, resetting to the beginning when it reaches the end.
         */
        function changeBackgroundColor() {
            // Set the background color of the body to the current color in the array
            document.body.style.backgroundColor = colors[currentColorIndex];

            // Increment the index for the next color
            currentColorIndex++;

            // If the index goes beyond the array length, reset it to 0 to cycle back to the first color
            if (currentColorIndex >= colors.length) {
                currentColorIndex = 0;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IGNTRZ Login - Tron Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Ensure html and body take full height for min-h-screen to work correctly */
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      /* overflow: hidden; Uncomment if you want to prevent all scrolling, but be cautious with responsive layouts */
    }
    body {
      font-family: 'Inter', sans-serif;
    }
    .input-glow-focus:focus {
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5), 0 0 10px rgba(59, 130, 246, 0.7); /* Blue glow */
    }
    .neon-border {
      border-image-slice: 1;
      border-image-source: linear-gradient(to right, #0ff, #f0f); /* Cyan to Magenta */
    }
    .neon-text-gradient {
      background: linear-gradient(to right, #00f0ff, #cc00ff); /* Cyan to Purple */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .button-neon-gradient {
      background-image: linear-gradient(to right, #00f0ff, #8a2be2); /* Cyan to Blue Violet */
    }
    .button-neon-gradient:hover {
      background-image: linear-gradient(to right, #8a2be2, #00f0ff); /* Reverse gradient on hover */
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.5; }
    }
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.4; }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-pulse {
      animation: pulse 4s infinite ease-in-out;
    }
    .animate-pulse-slow {
      animation: pulse-slow 6s infinite ease-in-out;
    }
    .animate-spin-slow {
      animation: spin-slow 20s linear infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div> <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React; // Destructure useState and useEffect from React

    // Inline SVG for User icon (from lucide-react concept)
    const UserIcon = ({ size = 24, ...props }) => (
      <svg

        height={size}

        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        {...props}
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>

    // Inline SVG for Lock icon (from lucide-react concept)
    const LockIcon = ({ size = 24, ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        {...props}

        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

    // Inline SVG for Eye icon (from lucide-react concept)
    const EyeIcon = ({ size = 24, ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        {...props}
      >

        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    );

    // Inline SVG for EyeOff icon (from lucide-react concept)
    const EyeOffIcon = ({ size = 24, ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        {...props}
      >

        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>

        <line x1="2" x2="22" y1="2" y2="22"></line>

    );

    const App = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(false);
      const [loginMessage, setLoginMessage] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        console.log('Logging in with:', { email, password, rememberMe });
        setLoginMessage('Login attempted! Check console for values.');
        setTimeout(() => {
          setLoginMessage('');
        }, 3000); // Message disappears after 3 seconds

      return (

                    <UserIcon className="inline-block mr-2 text-cyan-400" size={18} />

                  <div className="relative">
                    <input

                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      required
                    />
                  </div>
                </div>

                <div>
                  <label htmlFor="password" className="block text-sm font-medium text-gray-300 mb-2">
                    <LockIcon className="inline-block mr-2 text-purple-400" size={18} />

                  </label>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      id="password"

                      placeholder="Enter your password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}

                      onClick={() => setShowPassword(!showPassword)}

                      aria-label={showPassword ? 'Hide password' : 'Show password'}
                    >
                      {showPassword ? <EyeOffIcon size={20} /> : <EyeIcon size={20} />}

                  </div>
                </div>

                <div className="flex items-center justify-between text-sm">
                  <div className="flex items-center">

                      name="remember-me"
                      type="checkbox"
                      className="h-4 w-4 text-cyan-500 focus:ring-cyan-500 border-gray-600 rounded bg-gray-700"
                      checked={rememberMe}
                      onChange={(e) => setRememberMe(e.target.checked)}
                    />
                    <label htmlFor="remember-me" className="ml-2 block text-gray-300">
                      Remember me
                    </label>
                  </div>
                  <a href="#" className="font-medium text-purple-400 hover:text-purple-300 transition-colors duration-200">
                    Forgot password?
                  </a>
                </div>

                <div>

                    LOGIN

                </div>
              </form>

              <div className="mt-8 text-center text-gray-400">
                Don't have an account?{' '}
                <a href="#" className="font-medium text-cyan-400 hover:text-cyan-300 transition-colors duration-200">
                  Sign Up
                </a>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render the App component into the 'root' div
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Program</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS to ensure Inter font is used */
        body {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

    <!-- Main container for the app -->
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm flex flex-col items-center space-y-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Hello There!</h1>

        <!-- Input section -->
        <div class="w-full">
            <label for="nameInput" class="block text-gray-700 text-sm font-semibold mb-2">
                What's your name?
            </label>
            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <!-- Button to show greeting -->
        <button
            id="greetButton"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 ease-in-out transform hover:scale-105"
        >
            Say Hello!
        </button>

        <!-- Custom message box for greeting -->
        <div
            id="messageBox"
            class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative w-full text-center mt-4"
            role="alert"
        >
            <span id="messageContent"></span>
            <button
                id="closeMessage"
                class="absolute top-0 right-0 mt-1 mr-2 text-green-700 hover:text-green-900 focus:outline-none"
                aria-label="Close"
            >
                &times;
            </button>
        </div>
    </div>

    <script>
        // Get references to HTML elements
        const nameInput = document.getElementById('nameInput');
        const greetButton = document.getElementById('greetButton');
        const messageBox = document.getElementById('messageBox');
        const messageContent = document.getElementById('messageContent');
        const closeMessageButton = document.getElementById('closeMessage');

        /**
         * Displays a greeting message in the custom message box.
         * @param {string} name - The name to include in the greeting.
         */
        function showGreeting(name) {
            // Check if the name is not empty
            if (name.trim() !== '') {
                messageContent.textContent = `Hello, ${name}! Welcome to the interactive greeting app.`;
                messageBox.classList.remove('hidden'); // Show the message box
                // Automatically hide the message after 5 seconds
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 5000);
            } else {
                // If the name is empty, display a prompt to enter a name
                messageContent.textContent = "Please enter your name!";
                messageBox.classList.remove('hidden');
                messageBox.classList.remove('bg-green-100', 'border-green-400', 'text-green-700');
                messageBox.classList.add('bg-red-100', 'border-red-400', 'text-red-700'); // Use red for error
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                    // Revert to green after hiding
                    messageBox.classList.remove('bg-red-100', 'border-red-400', 'text-red-700');
                    messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
                }, 3000);
            }
        }

        // Add event listener to the button
        greetButton.addEventListener('click', () => {
            const userName = nameInput.value; // Get the value from the input field
            showGreeting(userName); // Call the function to display the greeting
        });

        // Add event listener to the close button of the message box
        closeMessageButton.addEventListener('click', () => {
            messageBox.classList.add('hidden'); // Hide the message box when close button is clicked
        });

        // Optional: Allow pressing Enter key to trigger the greeting
        nameInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                greetButton.click(); // Simulate a click on the greet button
            }
        });
    </script>
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
