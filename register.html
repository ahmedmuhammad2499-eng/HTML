<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Opera GX Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e; /* Dark background inspired by Opera GX */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 10vh; /* Changed from 100vh to 10vh to make it adaptable to other content */
            margin: 0;
            color: #e0e0e0;
        }

        .form-container {
            background-color: #2a2a4a; /* Slightly lighter dark background for the form */
            padding: 2.5rem;
            border-radius: 1.5rem; /* More rounded corners */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); /* Darker, subtle shadow */
            width: 100%;
            max-width: 450px;
            border: 1px solid #4a4a6e; /* Subtle border for definition */
        }

        .form-title {
            color: #e53e3e; /* Red accent color inspired by Opera GX */
            font-weight: 700;
            font-size: 2.25rem; /* Larger title */
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(229, 62, 62, 0.5); /* Glowing effect */
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 1rem;
            color: #e0e0e0;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background-color: #3b3b6b; /* Darker input background */
            border: 1px solid #5a5a8e; /* Input border */
            border-radius: 0.75rem; /* Rounded input fields */
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-field:focus {
            border-color: #e53e3e; /* Red accent on focus */
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.4); /* Red glow on focus */
        }

        .submit-button {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(90deg, #e53e3e 0%, #ff6b6b 100%); /* Red gradient button */
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 15px rgba(229, 62, 62, 0.4);
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 62, 62, 0.6);
        }

        .submit-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(229, 62, 62, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .form-container {
                margin: 1rem;
                padding: 2rem;
            }
            .form-title {
                font-size: 1.75rem;
                margin-bottom: 1.5rem;
            }
            .input-field, .submit-button {
                padding: 0.8rem 1rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title">Register for Opera GX!</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="name" class="input-label">Full Name</label>
                <input type="text" id="name" name="name" class="input-field" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label for="email" class="input-label">Email Address</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="password" class="input-label">Password</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="Create a password" required>
            </div>
            <button type="submit" class="submit-button">Register</button>
        </form>
    </div>
</body>
</html>
